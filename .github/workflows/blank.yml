name: Compilar btech-updater.nro (Interface Gráfica Horizon OS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-switch-app:
    name: Compilar btech-updater.nro para Nintendo Switch
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: 1. Baixar repositório GitHub
        uses: actions/checkout@v4

      - name: 2. Configurar permissões de segurança do Git
        run: |
          git config --global --add safe.directory "*"
          git config --global --add safe.directory "${{ github.workspace }}"

      - name: 3. Gerar código da Interface Gráfica Horizon OS (1280x720 com Textos e Controles)
        run: |
          mkdir -p source build romfs
          curl -sL "https://raw.githubusercontent.com/libnx/libnx/master/icon.png" -o romfs/icon.png || true
          
          cat << 'EOF' > source/main.cpp
