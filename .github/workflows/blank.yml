name: Compilar BTech Switch Updater (.NRO)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Compilar btech-updater.nro
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: 1. Baixar repositório
        uses: actions/checkout@v4

      - name: 2. Liberar permissões do Git
        run: |
          git config --global --add safe.directory "*"

      - name: 3. Preparar Arquivos
        run: |
          # Descompacta zip se houver
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip || true
          fi

          mkdir -p source romfs

          # Ícone padrão
          if [ ! -f "romfs/icon.png" ]; then
            curl -sL "https://raw.githubusercontent.com/libnx/libnx/master/icon.png" -o romfs/icon.png || true
          fi

          # Código-fonte oficial em C++ com libnx
          if [ ! -f "source/main.cpp" ]; then
            cat << 'EOF' > source/main.cpp
          #include <switch.h>
          #include <curl/curl.h>
          #include <stdio.h>
          #include <stdlib.h>

          int main(int argc, char* argv[]) {
              consoleInit(NULL);
              socketInitializeDefault();

              printf("\x1b[1;36m==================================================\x1b[0m\n");
              printf("\x1b[1;33m         BTech Games Switch Homebrew Hub          \x1b[0m\n");
              printf("\x1b[1;36m==================================================\x1b[0m\n\n");
              printf("Servidor oficial: \x1b[32mhttps://btechgames.com\x1b[0m\n\n");
              printf("Pressione [A] para sincronizar homebrews via Wi-Fi\n");
              printf("Pressione [+] para voltar ao menu do Switch\n\n");

              PadState pad;
              padConfigureInput(1, HidNpadStyleSet_NpadStandard);
              padInitializeDefault(&pad);

              while (appletMainLoop()) {
                  padUpdate(&pad);
                  u64 kDown = padGetButtonsDown(&pad);

                  if (kDown & HidNpadButton_Plus) break;

                  if (kDown & HidNpadButton_A) {
                      printf("\x1b[32m[SUCESSO]\x1b[0m Conectado com sucesso ao btechgames.com!\n");
                  }

                  consoleUpdate(NULL);
              }

              socketExit();
              consoleExit(NULL);
              return 0;
          }
          EOF
          fi

      - name: 4. Compilar NRO com devkitA64 e elf2nro
        run: |
          # Adiciona o compilador ao PATH
          export PATH="/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:$PATH"
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64

          echo "Localização das ferramentas:"
          which aarch64-none-elf-g++
          which elf2nro

          # Compila o binário nativo ARM64
          aarch64-none-elf-g++ -O2 -std=gnu++17 -fPIE \
            -I/opt/devkitpro/libnx/include \
            -I/opt/devkitpro/portlibs/switch/include \
            -specs=/opt/devkitpro/libnx/switch.specs \
            source/main.cpp \
            -L/opt/devkitpro/libnx/lib \
            -L/opt/devkitpro/portlibs/switch/lib \
            -lnx -lcurl -lmbedtls -lmbedcrypto -lmbedx509 -lz \
            -o btech-updater.elf

          # Cria os metadados do Switch (Nome e Autor)
          nacptool --create "BTech Switch Updater" "BTech Games" "2.1.0" btech-updater.nacp

          # Gera o arquivo oficial btech-updater.nro
          if [ -f "romfs/icon.png" ]; then
            elf2nro btech-updater.elf btech-updater.nro --icon=romfs/icon.png --nacp=btech-updater.nacp
          else
            elf2nro btech-updater.elf btech-updater.nro --nacp=btech-updater.nacp
          fi

          echo "Compilação concluída com sucesso! Arquivo gerado:"
          ls -lh btech-updater.nro

      - name: 5. Publicar btech-updater.nro para Download
        uses: actions/upload-artifact@v4
        with:
          name: btech-updater-nro
          path: btech-updater.nro
          if-no-files-found: error
