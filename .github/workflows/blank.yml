          static const int SCREEN_WIDTH  = 1280;
          static const int SCREEN_HEIGHT = 720;

          enum ActiveTab { TAB_INICIO = 0, TAB_AVISOS, TAB_HOMEBREWS, TAB_PORTS, TAB_VIP, TAB_CREDITOS, TAB_COUNT };

          struct ItemInfo { const char* title; const char* ver; const char* desc; };

          static const ItemInfo g_homebrews[6] = {
