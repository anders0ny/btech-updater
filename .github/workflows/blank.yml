              {"AIO Switch Updater", "v2.4.0", "Atualizador de Atmosphere, Hekate e sigpatches."},
              {"EdiZon SE", "v3.8.37", "Editor de memoria e gerenciador de cheats em tempo real."},
              {"NX-Shell", "v3.2.0", "Explorador de arquivos completo para o cartao SD."}
