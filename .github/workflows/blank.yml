name: Compilar BTech Switch Updater (.NRO)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Compilar btech-updater.nro
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: 1. Baixar repositório
        uses: actions/checkout@v4

      - name: 2. Liberar permissões do Git
        run: |
          git config --global --add safe.directory "*"

      - name: 3. Preparar Arquivos do Projeto (Auto-Detecção)
        run: |
          # Se houver algum zip, descompacta
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Descompactando arquivo zip..."
            unzip -o *.zip || true
          fi

          # Se o CMakeLists.txt estiver em subpasta, move para a raiz
          CMAKEPATH=$(find . -maxdepth 3 -name "CMakeLists.txt" ! -path "./borealis/*" | head -n 1)
          if [ -n "$CMAKEPATH" ] && [ "$CMAKEPATH" != "./CMakeLists.txt" ]; then
            SUBDIR=$(dirname "$CMAKEPATH")
            echo "Encontrado em $SUBDIR, movendo para a raiz..."
            cp -r "$SUBDIR"/* . || true
          fi

          # Se não existir, gera o projeto completo automaticamente!
          if [ ! -f "CMakeLists.txt" ]; then
            echo "Gerando estrutura C++ do BTech Updater..."
            mkdir -p source romfs include

            cat << 'EOF' > CMakeLists.txt
          cmake_minimum_required(VERSION 3.13)
          project(btech-updater CXX)
          set(CMAKE_CXX_STANDARD 17)
          find_package(LIBNX REQUIRED)
          add_subdirectory(borealis)
          add_executable(btech-updater source/main.cpp)
          target_include_directories(btech-updater PRIVATE include ${LIBNX_INCLUDE_DIRS})
          target_link_libraries(btech-updater PRIVATE borealis ${LIBNX_LIBRARIES} curl mbedtls mbedcrypto mbedx509 z)
          nx_create_nro(btech-updater NAME "BTech Switch Updater" AUTHOR "BTech Games" VERSION "2.1.0" ICON "romfs/icon.png" ROMFS "romfs")
          EOF

            cat << 'EOF' > source/main.cpp
          #include <borealis.hpp>
          #include <switch.h>
          #include <curl/curl.h>

          using namespace brls::literals;

          class MainView : public brls::Box {
          public:
              MainView() {
                  this->setOrientation(brls::BoxOrientation::VERTICAL);
                  this->setPadding(20, 20, 20, 20);

                  brls::Label* title = new brls::Label();
                  title->setText("BTech Switch Homebrew Hub");
                  title->setFontSize(24);
                  title->setTextColor(nvgRGB(0, 180, 216));
                  this->addView(title);

                  brls::Label* desc = new brls::Label();
                  desc->setText("Conectado a https://btechgames.com/wp-json/btech/v1/homebrews\nAtualizações automáticas via Wi-Fi.");
                  desc->setFontSize(14);
                  desc->setMarginTop(10);
                  this->addView(desc);

                  brls::Button* btn = new brls::Button();
                  btn->setText("Conectar ao Servidor BTech Games (A)");
                  btn->setMarginTop(20);
                  btn->registerClickAction([](brls::View* view) {
                      brls::Application::notify("Feed sincronizado com btechgames.com!");
                      return true;
                  });
                  this->addView(btn);
              }
          };

          int main(int argc, char* argv[]) {
              socketInitializeDefault();
              if (!brls::Application::init()) return EXIT_FAILURE;
              brls::AppletFrame* applet = new brls::AppletFrame(true, true);
              applet->setTitle("BTech Switch Hub");
              applet->addTab("Início", new MainView());
              applet->addTab("Avisos", new brls::Label(brls::Label::DIALOG, "Mural de Avisos BTech Games"));
              applet->addTab("Homebrews", new brls::Label(brls::Label::DIALOG, "Catálogo de Homebrews"));
              applet->addTab("Ports", new brls::Label(brls::Label::DIALOG, "Ports de Jogos"));
              applet->addTab("Membros VIP", new brls::Label(brls::Label::DIALOG, "Validação de Membros YouTube"));
              applet->addTab("Créditos", new brls::Label(brls::Label::DIALOG, "BTech Games - Anderson"));
              brls::Application::pushActivity(new brls::Activity(applet));
              while (brls::Application::mainLoop()) {}
              socketExit();
              return EXIT_SUCCESS;
          }
          EOF

            curl -sL "https://raw.githubusercontent.com/libnx/libnx/master/icon.png" -o romfs/icon.png || true
          fi

      - name: 4. Baixar Framework Gráfico Borealis
        run: |
          if [ ! -d "borealis" ]; then
            git clone --depth 1 https://github.com/natinusala/borealis.git borealis
          fi

      - name: 5. Compilar btech-updater.nro
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake ..
          make -j$(nproc)
          echo "Compilação concluída:"
          ls -lh

      - name: 6. Disponibilizar btech-updater.nro para Download
        uses: actions/upload-artifact@v4
        with:
          name: btech-updater-nro
          path: |
            build/*.nro
            *.nro
          if-no-files-found: error
