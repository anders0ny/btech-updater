name: Compilar BTech Switch Updater (.NRO)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Compilar btech-updater.nro
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: 1. Baixar repositório
        uses: actions/checkout@v4

      - name: 2. Liberar permissões do Git
        run: |
          git config --global --add safe.directory "*"

      - name: 3. Descompactar arquivos (caso tenha subido como .zip)
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Descompactando projeto..."
            unzip -o *.zip || true
          fi

      - name: 4. Baixar Borealis (Framework Gráfico Horizon OS)
        run: |
          if [ ! -d "borealis" ]; then
            git clone --depth 1 https://github.com/natinusala/borealis.git borealis || true
          fi

      - name: 5. Compilar btech-updater.nro
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake || cmake ..
          make -j$(nproc)
          echo "Compilação concluída:"
          ls -lh

      - name: 6. Disponibilizar btech-updater.nro para Download
        uses: actions/upload-artifact@v4
        with:
          name: btech-updater-nro
          path: |
            build/*.nro
            *.nro
          if-no-files-found: error
