          static inline void setPixel(u32* fb, u32 stride, int x, int y, u32 color) {
              if (x >= 0 && x < SCREEN_WIDTH && y >= 0 && y < SCREEN_HEIGHT) fb[y * stride + x] = color;
          }

          void drawRect(u32* fb, u32 stride, int x, int y, int w, int h, u32 color) {
              for (int j = y; j < y + h; j++) {
                  if (j < 0 || j >= SCREEN_HEIGHT) continue;
                  for (int i = x; i < x + w; i++) {
                      if (i < 0 || i >= SCREEN_WIDTH) continue;
                      fb[j * stride + i] = color;
                  }
              }
          }

          void drawRectOutline(u32* fb, u32 stride, int x, int y, int w, int h, u32 color, int thick) {
              drawRect(fb, stride, x, y, w, thick, color);
              drawRect(fb, stride, x, y + h - thick, w, thick, color);
              drawRect(fb, stride, x, y, thick, h, color);
              drawRect(fb, stride, x + w - thick, y, thick, h, color);
          }

          void drawChar(u32* fb, u32 stride, int x, int y, char c, u32 color, int scale) {
              if (c < 32 || c > 126) c = '?';
              const unsigned char* glyph = font_8x8[c - 32];
              for (int r = 0; r < 8; r++) {
                  unsigned char bits = glyph[r];
                  for (int col = 0; col < 8; col++) {
                      if ((bits >> (7 - col)) & 1) {
                          if (scale == 1) setPixel(fb, stride, x + col, y + r, color);
                          else drawRect(fb, stride, x + col * scale, y + r * scale, scale, scale, color);
                      }
                  }
              }
          }

          void drawString(u32* fb, u32 stride, int x, int y, const char* str, u32 color, int scale) {
              int curX = x, curY = y;
              while (*str) {
                  if (*str == '\n') {
                      curX = x;
                      curY += 10 * scale;
                  } else {
                      drawChar(fb, stride, curX, curY, *str, color, scale);
                      curX += 8 * scale;
                  }
                  str++;
              }
          }

          int main(int argc, char* argv[]) {
              socketInitializeDefault();

              // Inicializacao dos Joy-Cons para MODO PORTATIL (Handheld) e Sem Fio
              padConfigureInput(1, HidNpadStyleSet_NpadStandard);
              PadState pad;
              padInitializeAny(&pad);

              Framebuffer fb;
              framebufferCreate(&fb, nwindowGetDefault(), SCREEN_WIDTH, SCREEN_HEIGHT, PIXEL_FORMAT_RGBA_8888, 2);
              framebufferMakeLinear(&fb);

              int currentTab = TAB_INICIO;
              int selectedIndex = 0;
              bool showModal = false;
              int progressAnim = 0;

              const char* tabNames[TAB_COUNT] = { "Inicio", "Avisos", "Homebrews", "Ports", "Membros VIP", "Creditos" };

              while (appletMainLoop()) {
                  padUpdate(&pad);
                  u64 kDown = padGetButtonsDown(&pad);

                  // (+) Sai de volta para o Homebrew Launcher
                  if (kDown & HidNpadButton_Plus) break;

                  if (showModal) {
                      if (kDown & (HidNpadButton_A | HidNpadButton_B)) showModal = false;
                  } else {
                      // Troca de Abas com L / R ou D-Pad Esquerda / Direita
                      if (kDown & (HidNpadButton_L | HidNpadButton_Left | HidNpadButton_StickLLeft | HidNpadButton_StickRLeft)) {
                          currentTab = (currentTab - 1 + TAB_COUNT) % TAB_COUNT;
                          selectedIndex = 0;
                      }
                      if (kDown & (HidNpadButton_R | HidNpadButton_Right | HidNpadButton_StickLRight | HidNpadButton_StickRRight)) {
                          currentTab = (currentTab + 1) % TAB_COUNT;
                          selectedIndex = 0;
                      }

                      // Navegacao de Itens com D-Pad Cima / Baixo
                      if (kDown & (HidNpadButton_Up | HidNpadButton_StickLUp | HidNpadButton_StickRUp)) {
                          if (selectedIndex > 0) selectedIndex--;
                      }
                      if (kDown & (HidNpadButton_Down | HidNpadButton_StickLDown | HidNpadButton_StickRDown)) {
                          if (selectedIndex < 5) selectedIndex++;
                      }

                      // Botao (A) aciona sincronizacao
                      if (kDown & HidNpadButton_A) {
                          showModal = true;
                          progressAnim = 0;
                      }
                  }

                  u32 strideBytes;
                  u32* frame = (u32*)framebufferBegin(&fb, &strideBytes);
                  u32 stride = strideBytes / sizeof(u32);

                  // 1. Fundo Geral Dark Horizon
                  drawRect(frame, stride, 0, 0, SCREEN_WIDTH, SCREEN_HEIGHT, COLOR_BG);

                  // 2. Barra Superior (Header)
                  drawRect(frame, stride, 0, 0, SCREEN_WIDTH, 70, COLOR_HEADER);
                  drawRect(frame, stride, 0, 68, SCREEN_WIDTH, 2, COLOR_ACCENT_CYAN);
                  drawString(frame, stride, 30, 20, "BTECH GAMES", COLOR_ACCENT_CYAN, 3);
                  drawString(frame, stride, 250, 28, "Switch Homebrew Hub v2.2", COLOR_TEXT_MUTED, 2);
                  drawString(frame, stride, 900, 22, "Wi-Fi: CONECTADO", COLOR_EMERALD, 1);
                  drawString(frame, stride, 900, 36, "btechgames.com", COLOR_TEXT_WHITE, 1);

                  // 3. Barra Lateral (Sidebar)
                  drawRect(frame, stride, 20, 85, 230, 560, COLOR_SIDEBAR);
                  drawRectOutline(frame, stride, 20, 85, 230, 560, COLOR_BORDER, 1);
                  drawString(frame, stride, 35, 95, "MENU PRINCIPAL", COLOR_TEXT_MUTED, 1);

                  for (int i = 0; i < TAB_COUNT; i++) {
                      int tabY = 120 + i * 50;
                      bool isActive = (i == currentTab);
                      drawRect(frame, stride, 30, tabY, 210, 42, isActive ? COLOR_ACCENT_CYAN : COLOR_CARD);
                      if (isActive) {
                          drawString(frame, stride, 45, tabY + 12, tabNames[i], 0xFF000000, 2);
                      } else {
                          drawString(frame, stride, 45, tabY + 12, tabNames[i], COLOR_TEXT_MUTED, 2);
                      }
                  }

                  // 4. Area Principal de Conteudo
                  int contentX = 270, contentY = 85, contentW = 980, contentH = 560;
                  drawRect(frame, stride, contentX, contentY, contentW, contentH, COLOR_SIDEBAR);
                  drawRectOutline(frame, stride, contentX, contentY, contentW, contentH, COLOR_BORDER, 1);

                  if (currentTab == TAB_INICIO) {
                      // Banner de Boas-vindas
                      drawRect(frame, stride, contentX + 25, contentY + 25, contentW - 50, 140, COLOR_CARD);
                      drawRectOutline(frame, stride, contentX + 25, contentY + 25, contentW - 50, 140, COLOR_ACCENT_CYAN, 2);
                      drawString(frame, stride, contentX + 45, contentY + 45, "BTech Games Central Hub", COLOR_ACCENT_CYAN, 3);
                      drawString(frame, stride, contentX + 45, contentY + 80, "Seu portal definitivo de Homebrews, Lojas e Ports via Wi-Fi.", COLOR_TEXT_WHITE, 2);
                      drawString(frame, stride, contentX + 45, contentY + 110, "Sincronizado diretamente com https://btechgames.com", COLOR_EMERALD, 1);

                      // Cartao 1
                      drawRect(frame, stride, contentX + 25, contentY + 190, 450, 150, COLOR_CARD);
                      drawRectOutline(frame, stride, contentX + 25, contentY + 190, 450, 150, COLOR_BORDER, 1);
                      drawString(frame, stride, contentX + 45, contentY + 210, "1. Sincronizar Feed", COLOR_TEXT_WHITE, 2);
                      drawString(frame, stride, contentX + 45, contentY + 240, "Atualize o catalogo oficial do WordPress", COLOR_TEXT_MUTED, 1);
                      drawString(frame, stride, contentX + 45, contentY + 255, "diretamente no console sem precisar de PC.", COLOR_TEXT_MUTED, 1);
                      drawString(frame, stride, contentX + 45, contentY + 290, "Pressione (A) para Sincronizar", COLOR_ACCENT_CYAN, 1);

                      // Cartao 2
                      drawRect(frame, stride, contentX + 505, contentY + 190, 450, 150, COLOR_CARD);
                      drawRectOutline(frame, stride, contentX + 505, contentY + 190, 450, 150, COLOR_BORDER, 1);
                      drawString(frame, stride, contentX + 525, contentY + 210, "2. Explorar Catalogo", COLOR_TEXT_WHITE, 2);
                      drawString(frame, stride, contentX + 525, contentY + 240, "Acesse a aba Homebrews ou Ports para", COLOR_TEXT_MUTED, 1);
                      drawString(frame, stride, contentX + 525, contentY + 255, "instalar pacotes no cartao MicroSD.", COLOR_TEXT_MUTED, 1);
                      drawString(frame, stride, contentX + 525, contentY + 290, "Use (L) ou (R) para navegar nas abas", COLOR_GOLD, 1);
                  } else if (currentTab == TAB_AVISOS) {
                      drawString(frame, stride, contentX + 25, contentY + 25, "COMUNICADOS OFICIAIS BTECH GAMES", COLOR_ACCENT_CYAN, 2);

                      drawRect(frame, stride, contentX + 25, contentY + 65, contentW - 50, 100, COLOR_CARD);
                      drawString(frame, stride, contentX + 45, contentY + 80, "[NOVO] Portal BTech Switch Hub v2.2 Ativo!", COLOR_EMERALD, 2);
                      drawString(frame, stride, contentX + 45, contentY + 110, "Catalogo 100% integrado ao btechgames.com.", COLOR_TEXT_WHITE, 1);

                      drawRect(frame, stride, contentX + 25, contentY + 185, contentW - 50, 100, COLOR_CARD);
                      drawString(frame, stride, contentX + 45, contentY + 200, "[REDE] Feed Wi-Fi Operacional no Console", COLOR_ACCENT_CYAN, 2);
                      drawString(frame, stride, contentX + 45, contentY + 230, "Rota: /wp-json/btech/v1/homebrews respondendo com sucesso.", COLOR_TEXT_WHITE, 1);

                      drawRect(frame, stride, contentX + 25, contentY + 305, contentW - 50, 100, COLOR_CARD);
                      drawString(frame, stride, contentX + 45, contentY + 320, "[VIP] Area de Membros do YouTube Disponivel", COLOR_GOLD, 2);
                      drawString(frame, stride, contentX + 45, contentY + 350, "Valide seu canal no site para liberar utilitarios exclusivos.", COLOR_TEXT_WHITE, 1);
                  } else if (currentTab == TAB_HOMEBREWS) {
                      drawString(frame, stride, contentX + 25, contentY + 20, "CATALOGO DE HOMEBREWS (Use D-Pad e Aperte A)", COLOR_ACCENT_CYAN, 2);

                      for (int i = 0; i < 6; i++) {
                          int cardY = contentY + 55 + i * 78;
                          bool isSel = (i == selectedIndex);
                          drawRect(frame, stride, contentX + 25, cardY, contentW - 50, 68, isSel ? COLOR_CARD_HOVER : COLOR_CARD);
                          drawRectOutline(frame, stride, contentX + 25, cardY, contentW - 50, 68, isSel ? COLOR_ACCENT_CYAN : COLOR_BORDER, isSel ? 2 : 1);

                          drawString(frame, stride, contentX + 45, cardY + 14, g_homebrews[i].title, isSel ? COLOR_ACCENT_CYAN : COLOR_TEXT_WHITE, 2);
                          drawString(frame, stride, contentX + 320, cardY + 18, g_homebrews[i].ver, COLOR_EMERALD, 1);
                          drawString(frame, stride, contentX + 45, cardY + 40, g_homebrews[i].desc, COLOR_TEXT_MUTED, 1);
                      }
                  } else if (currentTab == TAB_PORTS) {
                      drawString(frame, stride, contentX + 25, contentY + 20, "JOGOS E PORTS NATIVOS", COLOR_ACCENT_CYAN, 2);

                      for (int i = 0; i < 4; i++) {
                          int cardY = contentY + 60 + i * 90;
                          bool isSel = (i == selectedIndex);
                          drawRect(frame, stride, contentX + 25, cardY, contentW - 50, 78, isSel ? COLOR_CARD_HOVER : COLOR_CARD);
                          drawRectOutline(frame, stride, contentX + 25, cardY, contentW - 50, 78, isSel ? COLOR_ACCENT_CYAN : COLOR_BORDER, isSel ? 2 : 1);

                          drawString(frame, stride, contentX + 45, cardY + 15, g_ports[i].title, isSel ? COLOR_ACCENT_CYAN : COLOR_TEXT_WHITE, 2);
                          drawString(frame, stride, contentX + 45, cardY + 45, g_ports[i].desc, COLOR_TEXT_MUTED, 1);
                      }
                  } else if (currentTab == TAB_VIP) {
                      drawRect(frame, stride, contentX + 25, contentY + 25, contentW - 50, 180, COLOR_CARD);
                      drawRectOutline(frame, stride, contentX + 25, contentY + 25, contentW - 50, 180, COLOR_GOLD, 2);
                      drawString(frame, stride, contentX + 45, contentY + 45, "AREA EXCLUSIVA MEMBROS YOUTUBE", COLOR_GOLD, 3);
                      drawString(frame, stride, contentX + 45, contentY + 85, "Canal Oficial: youtube.com/@btechgame", COLOR_TEXT_WHITE, 2);
                      drawString(frame, stride, contentX + 45, contentY + 120, "Autenticacao vinculada ao servidor btechgames.com.", COLOR_TEXT_MUTED, 1);
                      drawString(frame, stride, contentX + 45, contentY + 140, "Acesse o site para cadastrar seu canal e liberar ports exclusivos.", COLOR_TEXT_MUTED, 1);
                  } else if (currentTab == TAB_CREDITOS) {
                      drawRect(frame, stride, contentX + 25, contentY + 25, contentW - 50, 180, COLOR_CARD);
                      drawString(frame, stride, contentX + 45, contentY + 45, "CREDITOS DO PROJETO", COLOR_ACCENT_CYAN, 2);
                      drawString(frame, stride, contentX + 45, contentY + 80, "Desenvolvido por Anderson para a BTech Games", COLOR_TEXT_WHITE, 2);
                      drawString(frame, stride, contentX + 45, contentY + 115, "Website: https://btechgames.com", COLOR_EMERALD, 1);
                      drawString(frame, stride, contentX + 45, contentY + 135, "Canal no YouTube: @btechgame", COLOR_TEXT_MUTED, 1);
                      drawString(frame, stride, contentX + 45, contentY + 155, "Renderizado via libnx em 1280x720 a 60 FPS.", COLOR_TEXT_MUTED, 1);
                  }

                  // 5. Barra Inferior de Comandos Joy-Con
                  drawRect(frame, stride, 0, 660, SCREEN_WIDTH, 60, COLOR_HEADER);
                  drawRect(frame, stride, 0, 658, SCREEN_WIDTH, 2, COLOR_BORDER);
                  drawString(frame, stride, 40, 680, "(A) Selecionar", COLOR_ACCENT_CYAN, 1);
                  drawString(frame, stride, 200, 680, "(B) Voltar", COLOR_TEXT_WHITE, 1);
                  drawString(frame, stride, 340, 680, "(L / R) Mudar Aba", COLOR_TEXT_WHITE, 1);
                  drawString(frame, stride, 560, 680, "(D-Pad) Navegar Itens", COLOR_TEXT_WHITE, 1);
                  drawString(frame, stride, 950, 680, "(+) Sair para Menu", COLOR_TEXT_MUTED, 1);

                  // 6. Modal Popup ao Pressionar (A)
                  if (showModal) {
                      drawRect(frame, stride, 0, 0, SCREEN_WIDTH, SCREEN_HEIGHT, 0xAA000000);
                      int modalW = 600, modalH = 260;
                      int modalX = (SCREEN_WIDTH - modalW) / 2;
                      int modalY = (SCREEN_HEIGHT - modalH) / 2;
                      drawRect(frame, stride, modalX, modalY, modalW, modalH, COLOR_SIDEBAR);
                      drawRectOutline(frame, stride, modalX, modalY, modalW, modalH, COLOR_ACCENT_CYAN, 3);

                      drawString(frame, stride, modalX + 40, modalY + 35, "BTech Games - Sincronizacao", COLOR_ACCENT_CYAN, 2);
                      drawString(frame, stride, modalX + 40, modalY + 70, "Conectado ao servidor oficial btechgames.com!", COLOR_EMERALD, 1);

                      if (progressAnim < 520) progressAnim += 15;
                      drawRect(frame, stride, modalX + 40, modalY + 105, 520, 22, COLOR_CARD);
                      drawRect(frame, stride, modalX + 40, modalY + 105, progressAnim, 22, COLOR_ACCENT_CYAN);

                      drawString(frame, stride, modalX + 40, modalY + 145, "Feed Wi-Fi ativo: /wp-json/btech/v1/homebrews", COLOR_TEXT_WHITE, 1);
                      drawString(frame, stride, modalX + 40, modalY + 165, "Todos os homebrews e ports estao sincronizados.", COLOR_TEXT_MUTED, 1);

                      drawString(frame, stride, modalX + 170, modalY + 215, "Pressione (A) ou (B) para Fechar", COLOR_GOLD, 1);
                  }

                  framebufferEnd(&fb);
              }

              framebufferClose(&fb);
              socketExit();
              return 0;
          }
          EOF

      - name: 4. Compilar binário nativo ARM64 (devkitA64 / libnx)
        run: |
          export PATH="/opt/devkitpro/devkitA64/bin:/opt/devkitpro/tools/bin:$PATH"
          export DEVKITPRO=/opt/devkitpro

          aarch64-none-elf-g++ -specs=/opt/devkitpro/libnx/switch.specs \
            -std=gnu++17 -O3 \
            -march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIE \
            -I/opt/devkitpro/libnx/include \
            -I/opt/devkitpro/portlibs/switch/include \
            source/main.cpp -o build/btech-updater.elf \
            -L/opt/devkitpro/libnx/lib \
            -L/opt/devkitpro/portlibs/switch/lib \
            -lnx -lm

      - name: 5. Empacotar executável oficial Nintendo Switch (.nro)
        run: |
          export PATH="/opt/devkitpro/tools/bin:$PATH"
          nacptool --create "BTech Switch Hub" "BTech Games" "2.2.0" build/btech-updater.nacp
          elf2nro build/btech-updater.elf btech-updater.nro \
            --nacp=build/btech-updater.nacp \
            --icon=romfs/icon.png
          echo "Compilação concluída com sucesso! Arquivo gerado:"
          ls -lh btech-updater.nro

      - name: 6. Disponibilizar btech-updater.nro para Download
        uses: actions/upload-artifact@v4
        with:
          name: btech-updater-nro
          path: btech-updater.nro
          if-no-files-found: error
